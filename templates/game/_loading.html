{% comment %}
  Loading fragment (DEV-60 #12). Shown during AI generation.
  "The tale unfolds..." shimmer + animated dice. Reduced-motion = static.
{% endcomment %}
<div id="loading-overlay" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px 20px;">
  <div class="ld-dice" style="position:relative;width:56px;height:56px;">
    <svg data-lucide="hexagon" style="width:56px;height:56px;color:var(--ember);stroke-width:1.3;"></svg>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Newsreader',serif;font-size:22px;font-weight:600;color:var(--ember-2);" class="ld-num">?</div>
  </div>
  <div style="font-family:'Newsreader',serif;font-size:18px;color:var(--text-2);font-style:italic;">The tale unfolds…</div>
  <div style="display:flex;gap:6px;">
    <span style="width:6px;height:6px;border-radius:99px;background:var(--ember);animation:ld-dot 1.2s ease-in-out infinite;"></span>
    <span style="width:6px;height:6px;border-radius:99px;background:var(--ember);animation:ld-dot 1.2s ease-in-out infinite .2s;"></span>
    <span style="width:6px;height:6px;border-radius:99px;background:var(--ember);animation:ld-dot 1.2s ease-in-out infinite .4s;"></span>
  </div>
</div>
<style>
  @keyframes ld-dot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
  @keyframes ld-spin{to{transform:rotate(360deg)}}
  #loading-overlay .ld-dice{animation:ld-spin 2s linear infinite;}
  @media(prefers-reduced-motion:reduce){
    #loading-overlay .ld-dice{animation:none;}
    #loading-overlay span[style*="animation"]{animation:none !important;opacity:.6;}
  }
</style>
<script>
  if(window.lucide) lucide.createIcons();
</script>
