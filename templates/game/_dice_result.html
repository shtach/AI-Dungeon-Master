<div class="
    rounded-xl
    border
    p-4

    {% if roll.success %}
        border-green-500
    {% elif roll.failed %}
        border-red-500
    {% else %}
        border-zinc-700
    {% endif %}
">

    <div class="flex justify-between mb-2">

        <span class="font-bold">
            {{ roll.skill }}
        </span>

        <span>
            {{ roll.total }}
        </span>

    </div>

    <p class="text-zinc-400 text-sm">
        {{ roll.breakdown }}
    </p>

    {% if roll.dc %}
    <p class="text-xs mt-2 text-zinc-500">
        DC: {{ roll.dc }}
    </p>
    {% endif %}

</div>
