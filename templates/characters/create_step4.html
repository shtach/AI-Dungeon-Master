<div class="grid md:grid-cols-2 gap-8">

    <div class="bg-zinc-900 rounded-2xl p-6">

        <h2 class="text-2xl font-bold mb-4">
            Character Summary
        </h2>

        <p>{{ character.name }}</p>
        <p>{{ character.race }}</p>
        <p>{{ character.character_class }}</p>

    </div>

   
    <div>

        <textarea
            name="background"
            rows="10"
            class="w-full rounded-2xl bg-zinc-900 border border-zinc-700 p-4">

        </textarea>

        <button class="mt-6 btn-primary">
            Create Character
        </button>

    </div>

</div>
