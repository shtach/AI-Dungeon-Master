<div class="grid md:grid-cols-2 gap-6">

    {% for class in classes %}
    <label class="bg-zinc-900 p-6 rounded-2xl cursor-pointer">

        <input type="radio"
               name="class"
               value="{{ class.id }}"
               class="hidden">

        <h2 class="text-2xl font-bold mb-2">
            {{ class.name }}
        </h2>

        <p class="text-zinc-400">
            {{ class.description }}
        </p>

    </label>
    {% endfor %}

</div>
