{% extends "base.html" %}

{% block title %}Create Character — Step 2 of 4{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-xl" x-data="{ selectedClass: '{{ wizard_data.character_class|default:'' }}' }">

    <!-- Progress bar -->
    <div class="mb-8">
      <div class="flex justify-between text-xs text-dm-muted mb-2">
        <span class="text-dm-accent font-semibold">Step 2 of 4</span>
        <span>Class</span>
      </div>
      <div class="h-1 rounded-full bg-dm-surface">
        <div class="h-1 rounded-full bg-dm-accent" style="width: 50%"></div>
      </div>
    </div>

    <h1 class="text-2xl font-bold text-dm-text mb-1">Choose your path</h1>
    <p class="text-dm-muted text-sm mb-8">Your class defines how you fight, cast, and survive.</p>

    <form method="post" action="{% url 'characters:create_step2' %}">
      {% csrf_token %}

      <div class="flex flex-col gap-2 mb-8">

        <button type="button" @click="selectedClass = 'Warrior'"
                :class="selectedClass === 'Warrior' ? 'border-dm-accent' : 'border-dm-muted/30 hover:border-dm-muted'"
                class="flex items-center gap-4 p-4 rounded-xl border bg-dm-surface transition-colors duration-150 cursor-pointer text-left w-full">
          <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 text-xl"
               :class="selectedClass === 'Warrior' ? 'bg-dm-accent text-dm-bg' : 'bg-dm-bg text-dm-muted'">🛡</div>
          <div>
            <div class="font-semibold text-dm-text text-sm">Warrior</div>
            <div class="text-xs text-dm-muted mt-0.5">Frontline fighter in heavy armour. Strength-based — absorbs punishment so allies don't have to.</div>
          </div>
          <div class="ml-auto shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center"
               :class="selectedClass === 'Warrior' ? 'border-dm-accent bg-dm-accent' : 'border-dm-muted/50'">
            <svg x-show="selectedClass === 'Warrior'" class="w-3 h-3 text-dm-bg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
        </button>

        <button type="button" @click="selectedClass = 'Wizard'"
                :class="selectedClass === 'Wizard' ? 'border-dm-accent' : 'border-dm-muted/30 hover:border-dm-muted'"
                class="flex items-center gap-4 p-4 rounded-xl border bg-dm-surface transition-colors duration-150 cursor-pointer text-left w-full">
          <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 text-xl"
               :class="selectedClass === 'Wizard' ? 'bg-dm-accent text-dm-bg' : 'bg-dm-bg text-dm-muted'">✦</div>
          <div>
            <div class="font-semibold text-dm-text text-sm">Wizard</div>
            <div class="text-xs text-dm-muted mt-0.5">Ranged spellcaster with low HP but devastating intelligence-based magic. Fragile and fearsome.</div>
          </div>
          <div class="ml-auto shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center"
               :class="selectedClass === 'Wizard' ? 'border-dm-accent bg-dm-accent' : 'border-dm-muted/50'">
            <svg x-show="selectedClass === 'Wizard'" class="w-3 h-3 text-dm-bg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
        </button>

        <button type="button" @click="selectedClass = 'Rogue'"
                :class="selectedClass === 'Rogue' ? 'border-dm-accent' : 'border-dm-muted/30 hover:border-dm-muted'"
                class="flex items-center gap-4 p-4 rounded-xl border bg-dm-surface transition-colors duration-150 cursor-pointer text-left w-full">
          <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 text-xl"
               :class="selectedClass === 'Rogue' ? 'bg-dm-accent text-dm-bg' : 'bg-dm-bg text-dm-muted'">🗡</div>
          <div>
            <div class="font-semibold text-dm-text text-sm">Rogue</div>
            <div class="text-xs text-dm-muted mt-0.5">Agile and cunning striker. Dexterity-based — thrives on stealth, surprise attacks, and dirty tricks.</div>
          </div>
          <div class="ml-auto shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center"
               :class="selectedClass === 'Rogue' ? 'border-dm-accent bg-dm-accent' : 'border-dm-muted/50'">
            <svg x-show="selectedClass === 'Rogue'" class="w-3 h-3 text-dm-bg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
        </button>

        <button type="button" @click="selectedClass = 'Cleric'"
                :class="selectedClass === 'Cleric' ? 'border-dm-accent' : 'border-dm-muted/30 hover:border-dm-muted'"
                class="flex items-center gap-4 p-4 rounded-xl border bg-dm-surface transition-colors duration-150 cursor-pointer text-left w-full">
          <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 text-xl"
               :class="selectedClass === 'Cleric' ? 'bg-dm-accent text-dm-bg' : 'bg-dm-bg text-dm-muted'">☩</div>
          <div>
            <div class="font-semibold text-dm-text text-sm">Cleric</div>
            <div class="text-xs text-dm-muted mt-0.5">Divine conduit channelling godly power. Wisdom-based — blends healing, buffs, and holy combat.</div>
          </div>
          <div class="ml-auto shrink-0 w-5 h-5 rounded-full border-2 flex items-center justify-center"
               :class="selectedClass === 'Cleric' ? 'border-dm-accent bg-dm-accent' : 'border-dm-muted/50'">
            <svg x-show="selectedClass === 'Cleric'" class="w-3 h-3 text-dm-bg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
        </button>

      </div>

      <input type="hidden" name="character_class" :value="selectedClass">

      <div class="flex justify-between items-center">
        <a href="{% url 'characters:create_step1' %}"
           class="text-dm-muted hover:text-dm-text text-sm transition-colors duration-150">
          ← Back
        </a>
        <button type="submit"
                :disabled="!selectedClass"
                :class="selectedClass ? 'bg-dm-accent text-dm-bg hover:opacity-90 cursor-pointer' : 'bg-dm-surface text-dm-muted cursor-not-allowed border border-dm-muted/30'"
                class="px-6 py-3 rounded-xl font-semibold transition-all duration-150">
          Continue to Stats →
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}
