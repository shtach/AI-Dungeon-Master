{% extends "base.html" %}

{% block title %}New hero · Name & race{% endblock %}

{% block extra_head %}
<style>
  .wizpage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:46px 24px;position:relative;}
  .wizpage::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 35% at 50% 0,rgba(217,131,68,.09),transparent 60%);}
  .wiz{width:min(620px,100%);position:relative;z-index:1;}
  .prog{margin-bottom:32px;}
  .prog .steps{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-3);margin-bottom:10px;}
  .prog .steps b{color:var(--ember-2);font-weight:600;}
  .prog .track{height:3px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .prog .track i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--ember-2));border-radius:99px;transition:width .5s var(--ease);}
  .wiz h1{font-family:'Newsreader',serif;font-size:28px;font-weight:500;margin-bottom:6px;}
  .wiz .lead{color:var(--text-3);font-size:14.5px;margin-bottom:26px;}
  .opts{display:flex;flex-direction:column;gap:10px;margin:22px 0 30px;}
  .opt{display:flex;align-items:center;gap:15px;padding:15px 17px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:border-color .15s,background .15s,transform .12s;width:100%;text-align:left;font:inherit;color:inherit;}
  .opt:hover{border-color:var(--line-2);transform:translateX(2px);}
  .opt.sel{border-color:var(--ember);background:var(--ember-soft);}
  .opt .ic{width:44px;height:44px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex:none;transition:color .15s;}
  .opt.sel .ic{color:var(--ember-2);}
  .opt .ic svg{width:22px;height:22px;}
  .opt .t{font-weight:600;font-size:15px;} .opt .d{font-size:13px;color:var(--text-3);margin-top:1px;}
  .opt .check{margin-left:auto;width:22px;height:22px;border-radius:99px;border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;flex:none;transition:all .15s;color:#1a0f08;}
  .opt.sel .check{border-color:var(--ember);background:var(--ember);}
  .opt .check svg{width:13px;height:13px;opacity:0;transition:opacity .15s;}
  .opt.sel .check svg{opacity:1;}
  .wnav{display:flex;justify-content:space-between;align-items:center;}
</style>
{% endblock %}

{% block content %}
<div class="wizpage">
  <div class="wiz reveal" x-data="{ selectedRace: '{{ wizard_data.race|default:'' }}' }">

    <div class="prog">
      <div class="steps"><b>1 · Name &amp; race</b><span>2 · Class</span><span>3 · Stats</span><span>4 · Review</span></div>
      <div class="track"><i style="width:25%"></i></div>
    </div>

    <h1 class="serif">Who are you?</h1>
    <p class="lead">Name your hero and choose their lineage.</p>

    <form method="post" action="{% url 'characters:create_step1' %}">
      {% csrf_token %}

      <div class="field">
        <label>Hero name</label>
        <input class="input" type="text" name="name" value="{{ wizard_data.name|default:'' }}" placeholder="e.g. Thorin Ironhand" required>
      </div>

      <div class="opts">
        <button type="button" class="opt" :class="selectedRace==='HUMAN' && 'sel'" @click="selectedRace='HUMAN'">
          <span class="ic"><svg data-lucide="user-round"></svg></span>
          <span><span class="t">Human</span><span class="d" style="display:block;">Versatile and ambitious — excels at any path.</span></span>
          <span class="check"><svg data-lucide="check"></svg></span>
        </button>
        <button type="button" class="opt" :class="selectedRace==='ELF' && 'sel'" @click="selectedRace='ELF'">
          <span class="ic"><svg data-lucide="leaf"></svg></span>
          <span><span class="t">Elf</span><span class="d" style="display:block;">Ancient and graceful, keen of sense and magic.</span></span>
          <span class="check"><svg data-lucide="check"></svg></span>
        </button>
        <button type="button" class="opt" :class="selectedRace==='DWARF' && 'sel'" @click="selectedRace='DWARF'">
          <span class="ic"><svg data-lucide="hammer"></svg></span>
          <span><span class="t">Dwarf</span><span class="d" style="display:block;">Stout and resilient, forged in stone.</span></span>
          <span class="check"><svg data-lucide="check"></svg></span>
        </button>
        <button type="button" class="opt" :class="selectedRace==='ORC' && 'sel'" @click="selectedRace='ORC'">
          <span class="ic"><svg data-lucide="axe"></svg></span>
          <span><span class="t">Orc</span><span class="d" style="display:block;">Fierce and powerful, driven by raw strength.</span></span>
          <span class="check"><svg data-lucide="check"></svg></span>
        </button>
      </div>

      <input type="hidden" name="race" :value="selectedRace">

      <div class="wnav">
        <a class="btn btn-ghost" href="{% url 'game:dashboard' %}"><svg data-lucide="arrow-left" class="sm"></svg> Cancel</a>
        <button type="submit" class="btn btn-primary" :disabled="!selectedRace">Continue to class <svg data-lucide="arrow-right" class="sm"></svg></button>
      </div>
    </form>

  </div>
</div>
{% endblock %}
