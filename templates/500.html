<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — The Torches Went Dark</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-zinc-950 text-zinc-100 font-sans">
    <section class="flex min-h-[80vh] items-center justify-center px-6">
        <div class="mx-auto max-w-2xl text-center">

            <div class="mb-6">
                <div class="font-serif text-8xl font-bold tracking-wider text-red-500 md:text-9xl">
                    500
                </div>
            </div>

            <div class="mx-auto mb-6 h-px w-32 bg-gradient-to-r from-transparent via-red-500 to-transparent"></div>

            <h1 class="mb-4 font-serif text-3xl text-zinc-100 md:text-4xl">
                The torches went dark
            </h1>

            <p class="mb-10 text-lg text-zinc-400">
                Something gave way deep in the keep's foundations. The
                dungeon master has been alerted and is already relighting
                the way — try again in a moment.
            </p>

            <div class="flex flex-wrap items-center justify-center gap-4">
                <a
                    href="/"
                    class="rounded-md border border-red-600 bg-red-600/10 px-6 py-3 text-red-400 transition hover:bg-red-600/20"
                >
                    Try Again
                </a>

                <a
                    href="/login/"
                    class="rounded-md border border-zinc-700 px-6 py-3 text-zinc-300 transition hover:border-red-500 hover:text-white"
                >
                    Sign In
                </a>
            </div>

        </div>
    </section>
</body>
</html>
