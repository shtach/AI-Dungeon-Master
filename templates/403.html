{% extends "base.html" %}

{% block title %}403 — This Door Is Barred{% endblock %}

{% block content %}
<section class="flex min-h-[80vh] items-center justify-center px-6">
    <div class="mx-auto max-w-2xl text-center">

        <div class="mb-6">
            <div class="font-serif text-8xl font-bold tracking-wider text-violet-500 md:text-9xl">
                403
            </div>
        </div>

        <div class="mx-auto mb-6 h-px w-32 bg-gradient-to-r from-transparent via-violet-500 to-transparent"></div>

        <h1 class="mb-4 font-serif text-3xl text-zinc-100 md:text-4xl">
            This door is barred
        </h1>

        <p class="mb-10 text-lg text-zinc-400">
            The wards no longer know your face. Whatever lies beyond this
            threshold stays sealed until you prove who you are again.
        </p>

        <div class="flex flex-wrap items-center justify-center gap-4">
            <a
                href="{% url 'accounts:login' %}"
                class="rounded-md border border-violet-600 bg-violet-600/10 px-6 py-3 text-violet-400 transition hover:bg-violet-600/20"
            >
                Sign In Again
            </a>

            <a
                href="/"
                class="rounded-md border border-zinc-700 px-6 py-3 text-zinc-300 transition hover:border-violet-500 hover:text-white"
            >
                Return Home
            </a>
        </div>

    </div>
</section>
{% endblock %}
