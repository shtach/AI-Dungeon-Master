services:
  postgres_db:
    image: postgres:15-alpine
    container_name: game_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
 
  pgadmin:
    image: dpage/pgadmin4
    container_name: game_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres_db:
        condition: service_healthy
 
  web:
    build: .
    container_name: game_web
    restart: always
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py seed_data &&
             python manage.py tailwind build &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres_db:
        condition: service_healthy

  tailwind:
    build: .
    container_name: game_tailwind
    # CSS is built once by the `web` service before it serves (using the
    # image-cached binary), so the first page load is already styled. This
    # service only watches for changes and rebuilds during development.
    command: ["python", "manage.py", "tailwind", "start"]
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: postgres_db
 
volumes:
  pgdata: