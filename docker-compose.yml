version: "3.8"

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: game_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: game_pgadmin
    restart: always
    environment:
      # Для локальной разработки логин/пароль можно оставить тут,
      # но в будущем для продакшена обязательно вынесем в .env!
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - postgres_db

volumes:
  pgdata: