name: CI — Django Tests & Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_ai_dungeon
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: 🔄 Run migrations
        env:
          DJANGO_SETTINGS_MODULE: ai_dungeon_master.config.settings.test
          DB_NAME: test_ai_dungeon
          DB_USER: postgres
          DB_PASSWORD: postgres_test_password
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py migrate --no-input

      - name: 🧪 Run tests
        env:
          DJANGO_SETTINGS_MODULE: ai_dungeon_master.config.settings.test
          DB_NAME: test_ai_dungeon
          DB_USER: postgres
          DB_PASSWORD: postgres_test_password
          DB_HOST: localhost
          DB_PORT: "5432"
        run: pytest --tb=short -q

      - name: 🔍 Check for missing migrations
        # Any model change must include its migration in the same commit.
        env:
          DJANGO_SETTINGS_MODULE: ai_dungeon_master.config.settings.test
          DB_NAME: test_ai_dungeon
          DB_USER: postgres
          DB_PASSWORD: postgres_test_password
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py makemigrations --check --dry-run

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff

      - name: 🔥 Ruff linting
        run: ruff check .
